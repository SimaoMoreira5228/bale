name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: macos
            os: macos-15
          - name: windows-msvc
            os: windows-2025
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBALE_WERROR=ON
          -DBALE_LINK_COMPILE_COMMANDS=OFF
          ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure --parallel 4

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Sanitize
        env:
          CC: gcc-14
          CXX: g++-14
        run: ./dev sanitize

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install "clang-format==22.*"

      - name: Check formatting
        run: ./fmt --check
