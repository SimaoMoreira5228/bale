name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: macos
            os: macos-15
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBALE_WERROR=ON
          -DBALE_LINK_COMPILE_COMMANDS=OFF
          ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure --parallel 4


  windows-gcc16:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc=16.2.0-6
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Verify GCC 16
        run: test "$(gcc -dumpfullversion)" = "16.2.0"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBALE_WERROR=ON
          -DBALE_LINK_COMPILE_COMMANDS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60 --parallel 4

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Sanitize
        env:
          CC: gcc-14
          CXX: g++-14
        run: ./dev sanitize

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-18 libclang-rt-18-dev

      - name: Fuzz smoke
        env:
          FUZZ_CC: clang-18
          FUZZ_CXX: clang++-18
        run: ./dev fuzz all 30

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install "clang-format==22.*"

      - name: Check formatting
        run: ./fmt --check
